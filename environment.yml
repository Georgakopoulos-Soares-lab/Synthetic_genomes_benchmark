name: syn_bench

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - pip

  # workflow / bio
  - snakemake=7.18.0
  - bedtools=2.31.1

  # python libs commonly used in analysis + pipelines
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib

  # bio python libs
  - biopython
  - pysam
  - pybedtools
  - pyfaidx

  # parquet output from the non-B DNA aggregation
  - pyarrow

  # needed by scripts/classifier/ and generation/improve/.
  # The CPU build is enough for generation/improve/; the deep detector in
  # scripts/classifier/ wants a GPU build matched to your CUDA version.
  - pytorch


  - pip:
      - altair==4.0.0
